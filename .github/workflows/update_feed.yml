name: RSSフィード自動更新

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'  # 毎日 09:00/15:00/21:00/03:00 JST に実行
  workflow_dispatch:               # 手動実行ボタンも使えるようにする

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: RSSスクリプトを実行
        run: python bangdream_rss_generator.py

      - name: 変更があればコミット＆プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news_feed.xml
          git diff --cached --quiet || git commit -m "RSS フィード自動更新 $(date +'%Y-%m-%d %H:%M') JST"
          git push
